name: CI

 

on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main

 

env:

  CSV_URL: "MLproject/train_pca.csv"

 

jobs:

  build:

    runs-on: ubuntu-latest

 

    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE

      - uses: actions/checkout@v3

 

      # Setup Python 3.12.7

      - name: Set up Python 3.12.7

        uses: actions/setup-python@v4

        with:

          python-version: "3.12.7"

      

      # Check Env Variables

      - name: Check Env

        run: |

          echo $CSV_URL

 

      # Install mlflow

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install mlflow

      

      # Run as a mlflow project

      - name: Run mlflow project

        run: |
          cd Latihan-CI/MLproject
          mlflow run . --env-manager=local

 

# Save models to GitHub Repository
      - name: Save mlruns to repo
        run: |
          git config --global user.name "${{ secrets.username }}"
          git config --global user.email "${{ secrets.email }}"
          
          # Cek apakah folder mlruns ada di dalam Latihan-CI/MLproject/ dan pindahkan jika ada
          if [ -d "Latihan-CI/MLproject/mlruns" ]; then
            git add Latihan-CI/MLproject/mlruns/
            git commit -m "Save mlruns from CI run"
            git push origin main
          else
            echo "Folder mlruns tidak ditemukan. Memeriksa log..."
            exit 1
          fi
